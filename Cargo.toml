[package]
name = "ls-lr-analyzer"
version = "0.1.7"
edition = "2024"
rust-version = "1.99"
description = "Analyze and compare filesystem metadata snapshots from ls/find listings and exported artifacts."
repository = "https://github.com/widehyo1/ls-lr-analyzer"
readme = "README.md"
license = "MIT"
keywords = ["ls", "snapshot", "disk-usage", "filesystem", "cli"]
categories = ["command-line-utilities", "filesystem"]
include = ["Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "docs/find.md", "LICENSE", "src/**", "tests/**", "scripts/compare-memory.py"]

[dependencies]

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[features]
default = []
sqlite = ["dep:libc"]
duckdb = ["dep:libc"]
parquet = ["dep:libc"]
